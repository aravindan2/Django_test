language: python

python:
  - "3.14"

install:
  - pip install -r requirements.txt

before_script:
  - black --check .
  - flake8 .

script:
  - coverage run --source=polls manage.py test
  
after_success:
  - if [ "$TRAVIS_PYTHON_VERSION" = "3.14" ]; then coveralls --service-name travis-ci --service-branch "$TRAVIS_BRANCH"; fi

deploy:
  provider: elasticbeanstalk
  edge: true
  region: us-east-1
  app: djangotutorial
  env: django-env
  bucket: elasticbeanstalk-us-east-1-456157355328
  on:
    branch: master
    condition: "$TRAVIS_PYTHON_VERSION = 3.14"